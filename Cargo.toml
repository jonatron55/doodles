[workspace]
resolver = "3"
members = ["conway", "digirain", "doodle", "maze", "ripples", "sorty"]

[workspace.package]
authors = ["Jonathon Burnham Cobb"]
version = "0.2.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true

[workspace.dependencies]
bitflags = "2.11.0"
bitvec = "1.0.1"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.1"
rand = "0.10.1"
winresource = "0.1.31"
